name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-29
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, verified 2026-10-29
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: |
          export_dir="$(mktemp -d)"
          python3 tools/prepare-release.py --out "$export_dir/source"
          python3 tools/release_check.py --root "$export_dir/source" --strict-tree
